services:
  painrd:
    build: .
    image: painrd:local
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    ports:
      # Par défaut, accessible depuis le réseau local : http://ip-du-serveur:8090
      # Avec ADRESSE_ECOUTE=127.0.0.1 dans .env, réservé au serveur (accès par le tunnel seulement).
      - "${ADRESSE_ECOUTE:-0.0.0.0}:8090:8090"

  # Optionnel : accès depuis l'extérieur par un tunnel Cloudflare.
  # Démarré seulement avec : docker compose --profile cloudflare up -d
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      painrd:
        condition: service_healthy

volumes:
  # Base SQLite, photos et sauvegardes locales de PocketBase.
  pb_data:
